conky.config = {

    -- WINDOW
    own_window = true,
    own_window_type = 'normal',
    own_window_class = 'Conky',
    own_window_title = 'ConkySystem',
    own_window_hints = 'undecorated,above,sticky,skip_taskbar,skip_pager',
    own_window_argb_visual = true,
    own_window_argb_value = 200,
    own_window_transparent = false,
    own_window_colour = '#11111b',

    double_buffer = true,

    -- POSITION
    alignment = 'top_right',
    gap_x = 15,
    gap_y = 40,
    minimum_width = 280,
    maximum_width = 280,

    -- DRAW
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = true,
    border_inner_margin = 12,

    -- FONT
    use_xft = true,
    font = 'Fira Mono:size=9',
    xftalpha = 1.0,
    override_utf8_locale = true,

    -- PERFORMANCE
    update_interval = 1,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,
    use_spacer = 'none',
    short_units = true,

    default_color = '#cdd6f4',
    color1 = '#89b4fa',
    color2 = '#a6e3a1',
    color3 = '#f38ba8',
    color4 = '#f9e2af',
    color5 = '#6c7086',
    color6 = '#cba6f7',

};

conky.text = [[
${color1}${font Fira Mono:bold:size=12}CALENDAR${font}
${color5}${hr 1}
${color}${font Fira Mono:size=9}${time %A, %d %B %Y}${alignr}${time %H:%M:%S}${font}
${execpi 300 ncal -bh | sed -e 's/^/${color5}/' -e 's/\b'$(date +%-d)'\b/${color1}&${color5}/'}
${voffset 2}${color1}${font Fira Mono:bold:size=12}SYSTEM${font}
${color5}${hr 1}
${color4}Host${alignr}${color}${nodename}
${color4}Kernel${alignr}${color}${kernel}
${color4}Uptime${alignr}${color}${uptime_short}
${color4}Temp${alignr}${color}${hwmon coretemp temp 1}°C
${voffset 4}${color1}${font Fira Mono:bold:size=12}CPU${font} ${color}${cpu}%${alignr}${color4}${freq_g} GHz
${color5}${hr 1}
${cpugraph 35,280 89b4fa cba6f7 -t}
${color4}Core 1 ${color}${cpu cpu1}%${goto 150}${color4}Core 2 ${color}${cpu cpu2}%
${cpubar cpu1 5,125}${goto 155}${cpubar cpu2 5,125}
${color4}Core 3 ${color}${cpu cpu3}%${goto 150}${color4}Core 4 ${color}${cpu cpu4}%
${cpubar cpu3 5,125}${goto 155}${cpubar cpu4 5,125}
${color4}Core 5 ${color}${cpu cpu5}%${goto 150}${color4}Core 6 ${color}${cpu cpu6}%
${cpubar cpu5 5,125}${goto 155}${cpubar cpu6 5,125}
${voffset 4}${color1}${font Fira Mono:bold:size=12}MEMORY${font} ${color}${memperc}%${alignr}${color4}${mem} / ${memmax}
${color5}${hr 1}
${membar 8}
${memgraph 25,280 a6e3a1 f9e2af -t}
${color4}Swap${alignr}${color}${swap} / ${swapmax} (${swapperc}%)
${swapbar 5}
${voffset 4}${color1}${font Fira Mono:bold:size=12}DISK${font}${alignr}${color}${fs_used /} / ${fs_size /}
${color5}${hr 1}
${fs_bar 8 /}
${color4}Read ${color}${diskio_read}${alignr}${color4}Write ${color}${diskio_write}
${diskiograph_read 25,130 a6e3a1 a6e3a1}${alignr}${diskiograph_write 25,130 f38ba8 f38ba8}
${voffset 4}${color1}${font Fira Mono:bold:size=12}NETWORK${font} ${color5}(eno1)
${color5}${hr 1}
${color2}↓ ${color}${execi 1 ~/.config/conky/scripts/net_speed.sh eno1 rx}${alignr}${color3}↑ ${color}${execi 1 ~/.config/conky/scripts/net_speed.sh eno1 tx}
${downspeedgraph eno1 30,130 a6e3a1 a6e3a1 -t}${alignr}${upspeedgraph eno1 30,130 f38ba8 f38ba8 -t}
${color4}Total ↓ ${color}${totaldown eno1}${alignr}${color4}Total ↑ ${color}${totalup eno1}
${color4}Local IP${alignr}${color}${addr eno1}
${color4}Public IP${alignr}${color}${execi 300 curl -s ifconfig.me}
${voffset 4}${color1}${font Fira Mono:bold:size=12}TOP CPU${font}
${color5}${hr 1}
${color4}${top name 1}${alignr}${top cpu 1}%  ${top mem 1}%
${color4}${top name 2}${alignr}${top cpu 2}%  ${top mem 2}%
${color4}${top name 3}${alignr}${top cpu 3}%  ${top mem 3}%
${color4}${top name 4}${alignr}${top cpu 4}%  ${top mem 4}%
${color4}${top name 5}${alignr}${top cpu 5}%  ${top mem 5}%
]];
