conky.config = {
    -- Window settings
    own_window = true,
    own_window_type = 'normal',
    own_window_hints = 'undecorated,above,sticky,skip_taskbar,skip_pager',
    own_window_argb_visual = true,
    own_window_argb_value = 220,
    own_window_colour = '1e1e2e',

    -- Position & size
    alignment = 'top_right',
    gap_x = 15,
    gap_y = 50,
    minimum_width = 200,
    minimum_height = 100,

    -- Border & shape
    border_width = 1,
    draw_borders = false,
    draw_outline = false,
    draw_shades = false,
    border_inner_margin = 12,
    border_outer_margin = 4,

    -- Font
    use_xft = true,
    font = 'JetBrains Mono:size=10',
    override_utf8_locale = true,

    -- Update
    update_interval = 1.0,
    double_buffer = true,
    no_buffers = true,

    -- Network interface
    if_up_strictness = 'address',

    -- Colors
    default_color = 'cdd6f4',
    color1 = '89b4fa',  -- title/accent
    color2 = 'a6e3a1',  -- net labels
    color3 = 'f9e2af',  -- net values
    color4 = 'a6adc8',  -- sys labels
};

conky.text = [[
${color1}${font JetBrains Mono:bold:size=11}TRAFFIC MONITOR${font}${color}
${hr 1}
${color2}↓ ${color3}${downspeed eno1}${alignr}${color2}↑ ${color3}${upspeed eno1}${color}
${color4}Total: ${color}${totaldown eno1} / ${totalup eno1}
${hr 1}
${color4}CPU ${color}${alignr}${cpu}%
${cpubar 6}
${color4}RAM ${color}${alignr}${mem} / ${memmax} (${memperc}%)
${membar 6}
]];
